name: Data Library - worker de validação VPS

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Máximo de exemplos processados (1-1000; recomendado 15-50)"
        type: number
        default: 25
        required: true
      status:
        description: "Quais exemplos auditar"
        type: choice
        options:
          - legacy_pending_review
          - documented
          - all
        default: legacy_pending_review
        required: true
      language:
        description: "Linguagem (ou all)"
        type: choice
        options:
          - all
          - python
          - go
          - cpp
          - rust
          - javascript
          - typescript
          - angular
          - java
        default: all
        required: true
      mode:
        description: "Somente parser ou parser + teste"
        type: choice
        options:
          - both
          - parse
        default: both
        required: true

permissions:
  contents: read

# A VPS multiprojetos deve usar runner dedicado, sem Docker socket e sem credenciais dos outros projetos.
# Não criar trigger push/pull_request: executar exclusivamente por workflow_dispatch na main.
concurrency:
  group: data-library-vps-validation
  cancel-in-progress: false

jobs:
  validate-queue:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, data-library-worker]
    timeout-minutes: 90
    steps:
      - name: Checkout somente da main, sem persistir token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main

      - name: Verificar pré-requisitos da instalação
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          echo "Runner: $RUNNER_NAME"
          echo "Instale no runner somente os toolchains da linguagem selecionada."

      - name: Rodar fila JSON de validações
        shell: bash
        env:
          DL_MAX_ITEMS: ${{ inputs.max_items }}
          DL_STATUS: ${{ inputs.status }}
          DL_LANGUAGE: ${{ inputs.language }}
          DL_MODE: ${{ inputs.mode }}
          DL_OUTPUT: ${{ runner.temp }}/data-library-worker
        run: |
          set -euo pipefail
          python3 scripts/batch_worker.py \
            --max-items "$DL_MAX_ITEMS" \
            --status "$DL_STATUS" \
            --language "$DL_LANGUAGE" \
            --mode "$DL_MODE" \
            --output "$DL_OUTPUT"

      - name: Publicar fila, JSONL e resumo mesmo em caso de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-library-worker-${{ github.run_id }}
          path: ${{ runner.temp }}/data-library-worker/
          if-no-files-found: warn
          retention-days: 14
