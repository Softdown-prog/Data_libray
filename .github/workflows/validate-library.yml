name: Validate code library
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/catalog.py --check
      - name: Validar sintaxe do instalador VPS
        run: bash -n deploy/install-vps-worker.sh
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/search.py --language go
      - name: Worker smoke test (Python, um exemplo)
        run: python scripts/batch_worker.py --language python --status documented --max-items 1 --mode both --output "$RUNNER_TEMP/dl-worker-smoke"

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Parser Go (gofmt)
        run: python3 scripts/parser_audit.py --language go
      - run: cd go && go test -race -count=1 ./... && go vet ./...

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "ruff>=0.11,<1"
      - name: Parser Python (AST, sem executar)
        run: python3 scripts/parser_audit.py --language python
      - run: ruff check python scripts
      - run: python -m compileall -q python scripts
      - run: python scripts/run_python_tests.py

  cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parser C++20 (G++ syntax-only)
        run: python3 scripts/parser_audit.py --language cpp
      - name: Build and execute each C++20 example
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            binary="$(mktemp)"
            g++ -std=c++20 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=undefined -fno-sanitize-recover=all "$file" -o "$binary"
            "$binary"
            rm -f "$binary"
            count=$((count+1))
          done < <(find cpp -name 'main.cpp' -print0)
          test "$count" -gt 0

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parser Rust (cargo check)
        run: python3 scripts/parser_audit.py --language rust
      - run: cd rust && cargo fmt --all -- --check
      - run: cd rust && cargo clippy --workspace --all-targets -- -D warnings
      - run: cd rust && cargo test --workspace

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parser JavaScript (Node --check)
        run: python3 scripts/parser_audit.py --language javascript
      - run: find javascript -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
      - run: find javascript -name '*.test.mjs' -print0 | xargs -0 -r node --test

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g "typescript@~6.0.0"
      - name: Parser TypeScript (tsc strict)
        run: python3 scripts/parser_audit.py --language typescript
      - run: tsc -p typescript/tsconfig.json
      - run: tsc -p typescript/security/runtime-assertions/tsconfig.strict.json
      - run: find typescript/dist -name '*.test.js' -print0 | xargs -0 -r node --test

  angular:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix angular --no-audit --no-fund
      - name: Parser Angular (ngc strictTemplates)
        run: python3 scripts/parser_audit.py --language angular
      - run: cd angular && npx ngc -p tsconfig.json
      - name: Build do Angular para testes de comportamento (AOT)
        run: cd angular && ./node_modules/.bin/ngc -p tsconfig.behavior.json
      - name: Testar Signals, URLs e HttpClient mockado (sem navegador)
        run: node --test --test-force-exit tests/angular_behavior.test.mjs

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Parser Java 21 (javac isolado)
        run: python3 scripts/parser_audit.py --language java
      - name: Compile and execute isolated Java examples
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            dir="$(mktemp -d)"
            javac -Xlint:all -Werror -d "$dir" "$file"
            java -ea -cp "$dir" Main
            rm -rf "$dir"
            count=$((count+1))
          done < <(find java -name 'Main.java' -print0)
          test "$count" -gt 0
