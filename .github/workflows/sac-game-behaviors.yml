name: SAC game behaviors - Terrania combat and LHS queues
on:
  pull_request:
    paths:
      - 'packages/sac-multistack/real-games/*combat*'
      - 'packages/sac-multistack/real-games/*queue*'
      - 'packages/sac-multistack/real-games/behavior-browser-entry.mjs'
      - 'packages/sac-multistack/src/game-behavior-evidence.mjs'
      - 'scripts/sac_game_behaviors_combat_queues_probe.mjs'
      - 'tests/sac_game_behavior_evidence.test.mjs'
      - '.github/workflows/sac-game-behaviors.yml'
      - 'docs/SAC_REAL_GAME_BEHAVIORS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavior-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check adapters and negative evidence tests
        run: |
          node --check packages/sac-multistack/real-games/lhs-queue-entry.mjs
          node --check packages/sac-multistack/real-games/terrania-combat-entry.mjs
          node --check packages/sac-multistack/real-games/behavior-browser-entry.mjs
          node --check packages/sac-multistack/src/game-behavior-evidence.mjs
          node --check scripts/sac_game_behaviors_combat_queues_probe.mjs
          node --test tests/sac_game_behavior_evidence.test.mjs
  actual-game-behaviors:
    name: Pinned combat and customer queues in offline Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Softdown-prog/A7-forge-2D-
          ref: 2cb4be0144354f1753c9a0cec4edca929a9dc92f
          path: .sac-snapshots/lhs-canvas
          submodules: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Softdown-prog/Terrania
          ref: 3c94b6f11d656afc6740121b853056efe164830c
          path: .sac-snapshots/terrania-canvas
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned LHS bundler without scripts
        run: npm ci --prefix .sac-snapshots/lhs-canvas/games/lan_house_simulator --ignore-scripts --no-audit --no-fund
      - name: Install pinned Terrania Phaser without scripts
        run: npm ci --prefix .sac-snapshots/terrania-canvas --ignore-scripts --no-audit --no-fund
      - name: Install pinned SAC TypeScript AST parser
        run: npm ci --prefix packages/angular-postcompiler/smoke --ignore-scripts --no-audit --no-fund
      - name: Install trusted Playwright API without scripts
        run: npm install --prefix packages/angular-guardian --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Pull immutable browser sandbox
        run: docker pull mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      - name: Observe pursuit combat and queue lifecycle
        shell: bash
        env:
          SAC_SANDBOX_IMAGE: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
        run: |
          node scripts/sac_game_behaviors_combat_queues_probe.mjs > "$RUNNER_TEMP/sac-game-behavior-evidence.json"
          cat "$RUNNER_TEMP/sac-game-behavior-evidence.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sac-terrania-combat-lhs-queues
          path: ${{ runner.temp }}/sac-game-behavior-evidence.json
          if-no-files-found: error
          retention-days: 14
