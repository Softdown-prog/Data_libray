name: SAC procedural code stream and Canvas2D runtime probes
on:
  pull_request:
    paths:
      - 'packages/sac-multistack/src/procedural-canvas-stream.mjs'
      - 'packages/sac-multistack/src/procedural-properties.mjs'
      - 'packages/sac-multistack/src/canvas-evidence.mjs'
      - 'packages/sac-multistack/canvas/**'
      - 'packages/sac-multistack/fixtures/canvas/**'
      - 'tests/sac_procedural_canvas*.test.mjs'
      - 'scripts/sac_procedural_canvas_browser_probe.mjs'
      - 'scripts/sac_lhs_procedural_canvas_stream_probe.mjs'
      - '.github/workflows/sac-procedural-canvas.yml'
      - 'docs/SAC_PROCEDURAL_CANVAS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-thousand-file-contracts:
    name: Stream 5000 files and verify deterministic procedural properties
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install trusted pinned TypeScript AST parser only
        run: npm ci --prefix packages/angular-postcompiler/smoke --ignore-scripts --no-audit --no-fund
      - name: Parse 5000 sources and exercise negative grid/stream controls
        run: |
          node --check packages/sac-multistack/src/procedural-canvas-stream.mjs
          node --check packages/sac-multistack/src/procedural-properties.mjs
          node --check packages/sac-multistack/src/canvas-evidence.mjs
          node --test tests/sac_procedural_canvas.test.mjs tests/sac_procedural_canvas_browser_evidence.test.mjs
  real-game-pinned-source:
    name: Scan pinned Lan House Simulator source without running game code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Softdown-prog/A7-forge-2D-
          ref: 6256f7cbbc835cc8cff4121dca51f5f855ea784e
          path: .sac-snapshots/lhs-procedural
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install trusted TypeScript parser, never install game dependencies
        run: npm ci --prefix packages/angular-postcompiler/smoke --ignore-scripts --no-audit --no-fund
      - name: Record bounded source-only game AST evidence
        shell: bash
        run: |
          node scripts/sac_lhs_procedural_canvas_stream_probe.mjs > "$RUNNER_TEMP/sac-game-canvas-source.json"
          cat "$RUNNER_TEMP/sac-game-canvas-source.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sac-lhs-canvas-procedural-static-only
          path: ${{ runner.temp }}/sac-game-canvas-source.json
          if-no-files-found: error
          retention-days: 14
  canvas-chromium:
    name: Real Canvas2D pixel determinism in pinned offline Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install only the trusted Playwright API without lifecycle scripts
        run: npm install --prefix packages/angular-guardian --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Pull immutable Chromium sandbox
        run: docker pull mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      - name: Render seeded Canvas2D on desktop and mobile device pixel ratio
        shell: bash
        env:
          SAC_SANDBOX_IMAGE: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
        run: |
          node --check scripts/sac_procedural_canvas_browser_probe.mjs
          node --check packages/sac-multistack/canvas/entry.mjs
          node scripts/sac_procedural_canvas_browser_probe.mjs > "$RUNNER_TEMP/sac-canvas-pixels.json"
          cat "$RUNNER_TEMP/sac-canvas-pixels.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sac-canvas2d-synthetic-chromium-pixels
          path: ${{ runner.temp }}/sac-canvas-pixels.json
          if-no-files-found: error
          retention-days: 14
