name: SAC-PRE003 Pinned LHS Angular AOT (isolated)
on:
  push:
    branches: ['feat/sac-pre003-aot-concordance-20261104']
    paths:
      - 'scripts/sac_pre003_lhs_pinned_aot.mjs'
      - 'packages/angular-precompiler/src/component-wiring.mjs'
      - 'docs/SAC_COMPONENT_WIRING.md'
      - '.github/workflows/sac-pre003-lhs-pinned-aot.yml'
  pull_request:
    paths:
      - 'scripts/sac_pre003_lhs_pinned_aot.mjs'
      - 'packages/angular-precompiler/src/component-wiring.mjs'
      - 'docs/SAC_COMPONENT_WIRING.md'
      - '.github/workflows/sac-pre003-lhs-pinned-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lhs-pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout SAC without a retained token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node matching pinned Angular project
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Checkout immutable LHS snapshot without credentials
        uses: actions/checkout@v4
        with:
          repository: Softdown-prog/A7-forge-2D-
          ref: c5139c2cc5088adc3bbf0bf85d2952e64e2fc5ac
          path: .sac-snapshots/lhs
          persist-credentials: false
      - name: Assert exact source revision
        shell: bash
        run: |
          test "$(git -C .sac-snapshots/lhs rev-parse HEAD)" = 'c5139c2cc5088adc3bbf0bf85d2952e64e2fc5ac'
          test "$(git -C .sac-snapshots/lhs hash-object games/lan_house_simulator/frontend-angular/src/main.ts)" = '0b3411c903ebfeddb021cf4afa69fe5389d4637d'
      - name: Install trusted SAC TypeScript and run regression
        shell: bash
        run: |
          npm ci --prefix packages/angular-postcompiler/smoke --ignore-scripts --no-audit --no-fund
          node --check packages/angular-precompiler/src/component-wiring.mjs
          node --test tests/sac_angular_component_wiring.test.mjs
          node --check scripts/sac_pre003_lhs_pinned_aot.mjs
      - name: Inspect 45 real Angular TypeScript files before any build
        shell: bash
        run: |
          node scripts/sac_pre003_lhs_pinned_aot.mjs before > "$RUNNER_TEMP/sac-pre003-lhs-before.json"
          cat "$RUNNER_TEMP/sac-pre003-lhs-before.json"
      - name: Install official Angular toolchain from pinned LHS lockfile
        shell: bash
        run: npm ci --prefix .sac-snapshots/lhs/games/lan_house_simulator/frontend-angular --ignore-scripts --no-audit --no-fund
      - name: Official Angular AOT build - game UI
        shell: bash
        env:
          CI: 'true'
          NG_CLI_ANALYTICS: 'false'
        run: npm run build --prefix .sac-snapshots/lhs/games/lan_house_simulator/frontend-angular
      - name: Official Angular AOT build - institutional site
        shell: bash
        env:
          CI: 'true'
          NG_CLI_ANALYTICS: 'false'
        run: npm run build:site-rewrite --prefix .sac-snapshots/lhs/games/lan_house_simulator/frontend-angular
      - name: Reconcile static findings with both real AOT builds
        shell: bash
        run: |
          node scripts/sac_pre003_lhs_pinned_aot.mjs after > "$RUNNER_TEMP/sac-pre003-lhs-aot-comparison.json"
          cat "$RUNNER_TEMP/sac-pre003-lhs-aot-comparison.json"
      - name: Upload bounded evidence without app source or raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sac-pre003-lhs-pinned-aot-comparison
          path: |
            ${{ runner.temp }}/sac-pre003-lhs-before.json
            ${{ runner.temp }}/sac-pre003-lhs-aot-comparison.json
          if-no-files-found: ignore
          retention-days: 14
