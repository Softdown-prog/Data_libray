name: SAC Multistack contracts and native probes
on:
  pull_request:
    paths:
      - 'packages/sac-multistack/**'
      - 'tests/sac_multistack.test.mjs'
      - 'scripts/sac_multistack_native_probe.mjs'
      - '.github/workflows/sac-multistack.yml'
      - 'docs/SAC_MULTISTACK.md'
      - 'scripts/sac_multistack_markup_probe.mjs'
      - 'scripts/sac_multistack_vue_react_probe.mjs'
      - 'scripts/sac_multistack_browser_probe.mjs'
      - 'tests/sac_multistack_browser_evidence.test.mjs'
      - 'tests/sac_multistack_browser_docker.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check registration and safe inspector syntax
        run: |
          node --check packages/sac-multistack/src/registry.mjs
          node --check packages/sac-multistack/src/inspect.mjs
          node --check packages/sac-multistack/bin/inspect.mjs
          node --check scripts/sac_multistack_native_probe.mjs
      - name: Validate all 13 profiles, safety and no false-pass
        run: node --test tests/sac_multistack.test.mjs tests/sac_multistack_browser_evidence.test.mjs tests/sac_multistack_browser_docker.test.mjs
  native-compilers:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: First-party positive/negative compiler probes
        run: node scripts/sac_multistack_native_probe.mjs
  markup-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned HTML/CSS validators in disposable fixture only
        run: npm install --prefix packages/sac-multistack/fixtures --ignore-scripts --no-audit --no-fund
      - name: Prove HTML5 and CSS validation with valid and invalid synthetic files
        run: node scripts/sac_multistack_markup_probe.mjs
  official-vue-react:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install only first-party Vue/React fixture dependencies
        run: npm install --prefix packages/sac-multistack/fixtures/ui --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Official Vue SFC/React TSX typechecks, negative TS2339 and Vite builds
        run: node scripts/sac_multistack_vue_react_probe.mjs

  chromium-vue-react:
    name: Vue/React real Chromium interactions, isolated Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install first-party Vite fixtures with scripts disabled
        run: npm install --prefix packages/sac-multistack/fixtures/ui --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Install pinned Playwright API for sandbox runtime
        run: npm install --prefix packages/angular-guardian --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Pull pinned Chromium sandbox image
        run: docker pull mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      - name: Test positive and semantic regression builds in real isolated Chromium
        env:
          SAC_SANDBOX_IMAGE: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
        run: node scripts/sac_multistack_browser_probe.mjs
