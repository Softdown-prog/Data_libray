name: SAC signed three-build Angular Docker rehearsal
on:
  pull_request:
    paths:
      - 'scripts/sac_trusted_signed_docker_rehearsal.mjs'
      - 'scripts/sac_sandbox_builder.mjs'
      - 'packages/angular-pipeline/src/index.mjs'
      - 'packages/angular-pipeline/test/incremental-receipts.test.mjs'
      - '.github/workflows/sac-signed-angular-docker.yml'
      - 'docs/SAC_AUTHENTICATED_INCREMENTAL_RECEIPTS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-docker-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate fixed host code and receipt comparator
        run: |
          node --check scripts/sac_trusted_signed_docker_rehearsal.mjs
          node --check packages/angular-pipeline/src/index.mjs
      - name: Install trusted SAC dependencies without lifecycle scripts
        run: |
          npm ci --prefix packages/angular-core --ignore-scripts --no-audit --no-fund
          npm ci --prefix packages/angular-precompiler --ignore-scripts --no-audit --no-fund
          npm ci --prefix packages/angular-postcompiler --ignore-scripts --no-audit --no-fund
          npm test --prefix packages/angular-pipeline
      - name: Install first-party pinned Angular smoke fixture
        shell: bash
        run: |
          cp packages/angular-postcompiler/smoke/{package.json,package-lock.json,angular.json,tsconfig.json} packages/angular-guardian/smoke/
          npm ci --prefix packages/angular-guardian/smoke --ignore-scripts --no-audit --no-fund
      - name: Pull immutable build-only Docker image
        run: docker pull mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      - name: Execute three Docker builds and authenticate their receipts
        env:
          SAC_SANDBOX_IMAGE: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
        shell: bash
        run: |
          node scripts/sac_trusted_signed_docker_rehearsal.mjs > "$RUNNER_TEMP/sac-signed-three-angular-builds.json"
          cat "$RUNNER_TEMP/sac-signed-three-angular-builds.json"
      - name: Publish only bounded digest evidence, never the HMAC key
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sac-signed-three-angular-builds
          path: ${{ runner.temp }}/sac-signed-three-angular-builds.json
          if-no-files-found: error
          retention-days: 14
