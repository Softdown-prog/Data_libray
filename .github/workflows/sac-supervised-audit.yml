name: SAC-008C Supervised Angular audit offline
on:
  push:
    branches: ['feat/sac-008c-supervised-audit']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate executor and queue contracts
        run: |
          python -m py_compile scripts/sac_execution.py scripts/vps_daemon.py
          node --check scripts/sac_supervised_runner.mjs
          python -m unittest discover -s tests -p 'test_sac_execution.py' -v
          python -m unittest discover -s tests -p 'test_sac_job_queue.py' -v
          python -m unittest discover -s tests -p 'test_vps_daemon.py' -v
