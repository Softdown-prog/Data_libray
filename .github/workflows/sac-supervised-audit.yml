name: SAC-008C Supervised Angular audit offline
on:
  push:
    branches: ['feat/sac-008c-supervised-audit']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate executor and queue contracts
        run: |
          python -m py_compile scripts/sac_execution.py scripts/vps_daemon.py
          node --check scripts/sac_supervised_runner.mjs
          python -m unittest discover -s tests -p 'test_sac_execution.py' -v
          python -m unittest discover -s tests -p 'test_sac_job_queue.py' -v
          python -m unittest discover -s tests -p 'test_vps_daemon.py' -v
  integration:
    name: Angular AOT + sandbox Guardian end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix packages/angular-core --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/angular-precompiler --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/angular-postcompiler --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix packages/angular-guardian --ignore-scripts --no-audit --no-fund
      - name: Install official Angular fixture without lifecycle scripts
        run: |
          cp packages/angular-postcompiler/smoke/{package.json,package-lock.json,angular.json,tsconfig.json} packages/angular-guardian/smoke/
          npm ci --prefix packages/angular-guardian/smoke --ignore-scripts --no-audit --no-fund
      - name: Pull pinned Chrome sandbox image
        run: docker pull mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      - name: Run real Angular AOT, audited receipt and Chromium sandbox
        env:
          SAC_SANDBOX_IMAGE: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
        run: node scripts/sac_supervised_integration.mjs
