name: SAC-008D Angular build sandbox
on:
  push:
    branches: ['feat/sac-008d-isolated-angular-build', 'feat/sac-build-failure-evidence-20261102']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/sac_sandbox_builder.mjs
      - run: node --check scripts/sac_compiler_evidence.mjs
      - run: node --check scripts/sac_technical_report.mjs
      - run: node --check scripts/sac_preflight_result.mjs
      - run: node --check scripts/sac_phase_evidence_v2.mjs
      - run: node --check scripts/sac_supervised_runner.mjs
      - run: python3 -m py_compile scripts/sac_execution.py
      - run: python3 -m unittest discover -s tests -p 'test_sac_execution.py' -v
      - run: node --test tests/sac_sandbox_builder.test.mjs tests/sac_compiler_evidence.test.mjs tests/sac_technical_report.test.mjs tests/sac_preflight_result.test.mjs tests/sac_phase_evidence_v2.test.mjs
  integration:
    name: Official Angular AOT in isolated Docker + Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix packages/angular-core --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/angular-precompiler --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/angular-postcompiler --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix packages/angular-guardian --ignore-scripts --no-audit --no-fund
      - name: Install Angular fixture dependencies in disposable CI
        run: |
          cp packages/angular-postcompiler/smoke/{package.json,package-lock.json,angular.json,tsconfig.json} packages/angular-guardian/smoke/
          npm ci --prefix packages/angular-guardian/smoke --ignore-scripts --no-audit --no-fund
      - name: Pull immutable Docker image
        run: docker pull mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      - name: Build only inside Docker and verify SAC/Chromium
        env:
          SAC_SANDBOX_IMAGE: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
        run: node scripts/sac_isolated_build_integration.mjs
      - name: Publish only verified synthetic Worker report and factual text
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sac-v2-worker-factual-report-synthetic
          path: |
            ${{ runner.temp }}/sac-v2-technical-report.synthetic.txt
            \${{ runner.temp }}/sac-v2-technical-report.synthetic.json
            \${{ runner.temp }}/sac-v2-post.synthetic.json
            \${{ runner.temp }}/sac-v2-post.synthetic.pt-BR.txt
            \${{ runner.temp }}/sac-v2-guardian.synthetic.json
            \${{ runner.temp }}/sac-v2-guardian.synthetic.pt-BR.txt
          if-no-files-found: error
          retention-days: 14
