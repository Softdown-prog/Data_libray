name: SAC Brain v1 local diagnostic engine
on:
  push:
    branches: ['feat/sac-brain-v1-20261102']
    paths:
      - 'scripts/sac_brain.mjs'
      - 'scripts/sac_brain_cli.mjs'
      - 'scripts/sac_brain_worker_reply.mjs'
      - 'scripts/sac_brain_worker_reply_cli.mjs'
      - 'knowledge/sac-brain-v1.json'
      - 'tests/sac_brain.test.mjs'
      - 'tests/sac_brain_worker_reply.test.mjs'
      - 'tests/fixtures/sac-brain-vps-reply.synthetic.json'
      - 'tests/fixtures/sac-brain-incident.synthetic.json'
      - 'docs/SAC_BRAIN_V1.md'
      - '.github/workflows/sac-brain-v1.yml'
  pull_request:
    paths:
      - 'scripts/sac_brain.mjs'
      - 'scripts/sac_brain_cli.mjs'
      - 'scripts/sac_brain_worker_reply.mjs'
      - 'scripts/sac_brain_worker_reply_cli.mjs'
      - 'knowledge/sac-brain-v1.json'
      - 'tests/sac_brain.test.mjs'
      - 'tests/sac_brain_worker_reply.test.mjs'
      - 'tests/fixtures/sac-brain-vps-reply.synthetic.json'
      - 'tests/fixtures/sac-brain-incident.synthetic.json'
      - '.github/workflows/sac-brain-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify local engine and diagnostic schema
        run: |
          node --check scripts/sac_brain.mjs
          node --check scripts/sac_brain_cli.mjs
          node --check scripts/sac_brain_worker_reply.mjs
          node --check scripts/sac_brain_worker_reply_cli.mjs
          node --test tests/sac_brain.test.mjs tests/sac_brain_worker_reply.test.mjs tests/sac_diagnostic_report.test.mjs
      - name: Reject nonlocal runtime imports
        run: |
          if grep -E '^import .* from ' scripts/sac_brain.mjs scripts/sac_brain_cli.mjs scripts/sac_brain_worker_reply.mjs scripts/sac_brain_worker_reply_cli.mjs | grep -Ev "from 'node:fs'|from './sac_brain.mjs'|from './sac_brain_worker_reply.mjs'"; then
            echo 'Unexpected SAC Brain dependency' >&2
            exit 1
          fi
      - name: Produce a reproducible sanitized report from synthetic incident
        run: |
          node scripts/sac_brain_cli.mjs tests/fixtures/sac-brain-incident.synthetic.json > sac-brain-report.synthetic.json
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const r=JSON.parse(fs.readFileSync('sac-brain-report.synthetic.json','utf8')); assert.equal(r.known,1); assert.equal(r.unknown,1); assert.equal(r.deployment_authorized,false); assert.equal(r.root_cause_verified,false); assert.ok(!JSON.stringify(r).includes('FAKE_SECRET_VALUE'));"
      - name: Upload SAC Brain synthetic diagnostic (no secrets)
        uses: actions/upload-artifact@v4
        with:
          name: sac-brain-v1-synthetic-diagnostic
          path: sac-brain-report.synthetic.json
          if-no-files-found: error
          retention-days: 14
      - name: Reproduce safe VPS job response from synthetic data
        run: |
          node scripts/sac_brain_worker_reply_cli.mjs tests/fixtures/sac-brain-vps-reply.synthetic.json > sac-brain-vps-reply.synthetic.json
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const r=JSON.parse(fs.readFileSync('sac-brain-vps-reply.synthetic.json','utf8')); assert.equal(r.status,'fail'); assert.equal(r.known,1); assert.equal(r.unknown,1); assert.equal(r.origin_verified,false); assert.ok(!JSON.stringify(r).includes('SECRET_SHOULD_NOT_APPEAR'));"
      - name: Upload synthetic VPS SAC analysis
        uses: actions/upload-artifact@v4
        with:
          name: sac-brain-vps-reply-synthetic
          path: sac-brain-vps-reply.synthetic.json
          retention-days: 14
          if-no-files-found: error
