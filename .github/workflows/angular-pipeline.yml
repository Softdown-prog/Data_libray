name: SAC Universal Pipeline
on:
  pull_request:
  push:
    branches: ['research/angular-prepost-corpus']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix packages/angular-core --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/angular-precompiler --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/angular-postcompiler --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix packages/angular-pipeline
      - name: Reject incompatible Angular fixture versions
        run: |
          node scripts/check_angular_fixture.mjs
          node --test tests/check_angular_fixture.test.mjs
      - run: npm ci --prefix packages/angular-postcompiler/smoke --ignore-scripts --no-audit --no-fund
      - name: Official Angular build with authenticated evidence
        run: node packages/angular-pipeline/examples/official.mjs > "${{ runner.temp }}/sac-pipeline-official.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sac-pipeline-evidence
          path: ${{ runner.temp }}/sac-pipeline-official.json
          if-no-files-found: ignore
