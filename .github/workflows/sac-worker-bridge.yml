name: SAC One Worker Bridge Offline
on:
  pull_request:
  push:
    branches: ['research/angular-prepost-corpus']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check offline bridge syntax
        run: python -m compileall -q scripts/sac_worker_bridge.py tests/test_sac_worker_bridge.py
      - name: Run signed-job and fail-closed regressions
        run: python -m unittest discover -s tests -p 'test_sac_worker_bridge.py' -v
